data:
  url: "https://www.manythings.org/anki/rus-eng.zip"
  train_split: 0.85
  val_split: 0.075
  test_split: 0.075
  sequence_length: 20
  vocab_size: 25000

model:
  embed_dim: 256
  hidden_dim: 512
  dropout: 0.3

training:
  batch_size: 64
  epochs: 20
  learning_rate: 1e-3
  weight_decay: 1e-4
  teacher_forcing_start: 1.0
  teacher_forcing_end: 0.5
  clip_grad: 1.0
  patience: 3
  min_delta: 1e-4

device: "cuda"

seed: 42
